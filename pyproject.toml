[build-system]
requires = ["setuptools >= 61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mitgcm_utils"
authors = [{ name = "Prajeesh Ag", email = "prajeeshag@gmail.com" }]
dynamic = ["version"]
description = "Command line tools for MITgcm"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=2.2,<2.3",
    "xarray>=2025.3,<2025.4",
    "netcdf4>=1.7,<1.8",
    "f90nml>=1.4,<1.5",
    "cdo>=1.6,<1.7",
    "typer>=0.15,<0.16",
    "scipy>=1.15,<1.16",
    "matplotlib>=3.10,<3.11",
    "pandas>=2.2,<2.3",
    "mpl_interactions>=0.24,<0.25",
    "sphericalpolygon>=1.2,<1.3",
]

[tool.setuptools.packages.find]
exclude = ["test_data", "docs"]

[project.scripts]
mkMITgcmEXF = "mitgcm_utils.mkMITgcmEXF:app"
mkMITgcmBC = "mitgcm_utils.mkMITgcmBC:app"
mkMITgcmGrid = "mitgcm_utils.mkMITgcmGrid:app"
beditor = "mitgcm_utils.beditor:app"
